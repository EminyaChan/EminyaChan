name: Weekly Marketing Content Agent

on:
  schedule:
    # Every Monday at 08:00 UTC. Edit this line to change day/time.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python -m src.main --source sheets

      - name: Upload this week's drafts as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-drafts-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Commit run log
        run: |
          git config user.name "marketing-content-agent"
          git config user.email "actions@github.com"
          git add logs/run_log.jsonl
          git diff --cached --quiet || git commit -m "Weekly content agent run log"
          git push
